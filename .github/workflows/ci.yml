name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-tested.txt
            pyproject.toml
      - name: Install reference environment
        run: python -m pip install -e . -r requirements-tested.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check privacy patterns
        run: python -B scripts/privacy_check.py
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
