[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-data-pipeline"
version = "0.3.0"
description = "Contract-driven data-quality engines and governed CSV and SQLite workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "pandas>=2.2,<4"]

[project.urls]
Repository = "https://github.com/daudakamandadk-lang/governed-data-pipeline"
Documentation = "https://github.com/daudakamandadk-lang/governed-data-pipeline/blob/main/docs/README.md"
Issues = "https://github.com/daudakamandadk-lang/governed-data-pipeline/issues"

[project.optional-dependencies]
file-formats = ["openpyxl>=3.1", "pyarrow>=15"]

[project.scripts]
governed-pipeline = "governed_data_pipeline.demo:cli"

governed-database = "governed_data_pipeline.database_demo:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["governed_data_pipeline*"]

[tool.setuptools.package-data]
governed_data_pipeline = ["demo_config.json"]
