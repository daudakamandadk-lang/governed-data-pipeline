[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-pipeline"
version = "0.2.0"
description = "Reusable data-quality engines and a governed CSV-to-SQLite learning workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "pandas>=2.2,<4"]

[project.optional-dependencies]
file-formats = ["openpyxl>=3.1", "pyarrow>=15"]

[project.scripts]
governed-pipeline = "credit_risk_pipeline.demo:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
credit_risk_pipeline = ["demo_config.json"]
